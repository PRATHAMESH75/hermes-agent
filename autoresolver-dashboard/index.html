<title>Hermes Base</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@500;700;800&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
:root{
  color-scheme: dark;
  --forest:#1f3a24; --forest-2:#274a2c;
  --grass:#6aa447; --grass-2:#5d943d; --grass-line:rgba(255,255,255,.07);
  --dirt:#c9a46a; --dirt-2:#a9844c;
  --stone:#8b95a1; --stone-2:#646e7a; --stone-3:#b9c1ca;
  --wood:#4a2f1d; --wood-2:#5e3c25; --wood-3:#7a5033; --wood-edge:#2c1b10;
  --parch:#f4e6c4; --parch-2:#e8d4a7; --ink:#3a2616; --ink-2:#6b5038;
  --gold:#f3bb2d; --gold-2:#b98410;
  --elixir:#b65ae3; --elixir-2:#7d2fb0;
  --salvage:#2bb3a3; --closed:#8a8f98; --danger:#d9533b; --ok:#57b04a;
  --text:#fff6e2; --text-dim:#e7d6b4;
  --shadow: 0 3px 0 var(--wood-edge), 0 8px 18px rgba(0,0,0,.35);
  --display:"Lilita One", "Arial Rounded MT Bold", "Trebuchet MS", system-ui, sans-serif;
  --body:"Nunito", ui-rounded, "Segoe UI", system-ui, sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
*{box-sizing:border-box}
html,body{background:var(--forest)}
body{
  font-family:var(--body); color:var(--text); font-size:15px; line-height:1.45;
  background:
    radial-gradient(1200px 500px at 50% -10%, #2f5a34 0%, transparent 70%),
    repeating-linear-gradient(135deg, transparent 0 22px, rgba(0,0,0,.05) 22px 44px),
    var(--forest);
  min-height:100%;
}
.wrap > *, .board > *, .lower > *{min-width:0}
.wrap{max-width:1320px; margin:0 auto; padding-inline:16px; padding-block:14px 48px; display:grid; gap:16px}
a{color:inherit}
a:focus-visible, button:focus-visible, input:focus-visible, [tabindex]:focus-visible{outline:3px solid var(--gold); outline-offset:2px; border-radius:6px}

/* ---------- top bar ---------- */
.topbar{
  display:flex; flex-wrap:wrap; align-items:center; gap:14px 22px; justify-content:space-between;
  background:linear-gradient(var(--wood-3), var(--wood-2)); border:3px solid var(--wood-edge);
  border-radius:16px; padding:10px 16px; box-shadow:var(--shadow);
}
.brand{display:flex; align-items:center; gap:12px; min-width:0}
.brand svg{flex:none}
.brand h1{font-family:var(--display); font-weight:400; font-size:30px; margin:0; letter-spacing:.5px; line-height:1;
  color:var(--text); text-shadow:0 2px 0 var(--wood-edge), 0 0 1px var(--wood-edge)}
.brand .sub{font-size:12.5px; color:var(--text-dim); margin-top:3px}
.brand .sub b{font-family:var(--mono); font-weight:500}
.resources{display:flex; flex-wrap:wrap; gap:10px 18px}
.res{display:grid; grid-template-columns:auto 1fr; align-items:center; gap:6px; min-width:150px}
.res .bar{position:relative; height:22px; border-radius:11px; background:rgba(0,0,0,.45); border:2px solid var(--wood-edge); overflow:hidden}
.res .fill{position:absolute; inset:0 auto 0 0; border-radius:9px; transition:width .9s cubic-bezier(.2,.8,.2,1)}
.res .fill::after{content:""; position:absolute; inset:2px 4px auto 4px; height:5px; border-radius:4px; background:rgba(255,255,255,.35)}
.res .num{position:absolute; inset:0; display:flex; align-items:center; justify-content:flex-end; padding-right:9px;
  font-family:var(--display); font-size:15px; text-shadow:0 1px 0 #000, 0 0 3px #000}
.res .lbl{grid-column:2; font-size:11px; text-transform:uppercase; letter-spacing:.08em; color:var(--text-dim); margin-top:-3px}
.res.gold .fill{background:linear-gradient(var(--gold), var(--gold-2))}
.res.elixir .fill{background:linear-gradient(#d487f5, var(--elixir-2))}
.res.stone .fill{background:linear-gradient(var(--stone-3), var(--stone-2))}

/* ---------- panels ---------- */
.board{display:grid; grid-template-columns:minmax(0,1fr) 380px; gap:16px; align-items:start}
@media (max-width:1020px){ .board{grid-template-columns:minmax(0,1fr)} }
.panel{background:linear-gradient(var(--wood-2), var(--wood)); border:3px solid var(--wood-edge); border-radius:18px; box-shadow:var(--shadow); padding:12px}
.panel > h2, .sect-title{font-family:var(--display); font-weight:400; font-size:21px; letter-spacing:.4px; margin:2px 4px 10px; text-shadow:0 2px 0 var(--wood-edge); text-wrap:balance}
.panel > h2 small{font-family:var(--body); font-size:12.5px; color:var(--text-dim); letter-spacing:0; text-shadow:none; margin-left:6px; font-weight:700}

/* ---------- scene ---------- */
.scene-wrap{position:relative; border-radius:12px; overflow:hidden; border:3px solid var(--wood-edge); background:#23422a}
.scene-wrap svg{display:block; width:100%; height:auto}
.scene-hint{position:absolute; left:10px; bottom:10px; font-size:12px; background:rgba(20,12,6,.72); padding:5px 10px; border-radius:999px; color:var(--text-dim); pointer-events:none}
.tip{position:absolute; pointer-events:none; transform:translate(-50%, calc(-100% - 12px)); background:var(--parch); color:var(--ink);
  border:3px solid var(--wood-edge); border-radius:12px; padding:7px 11px; font-size:13px; min-width:170px; box-shadow:0 6px 16px rgba(0,0,0,.4); z-index:3}
.tip b{font-family:var(--display); font-weight:400; font-size:16px; display:block; line-height:1.1}
.tip .row{display:flex; gap:10px; margin-top:3px; font-weight:800; font-variant-numeric:tabular-nums}
.tip .row span{display:flex; align-items:center; gap:4px}
.dot{width:9px; height:9px; border-radius:50%; display:inline-block; border:1.5px solid rgba(0,0,0,.35); flex:none}
.bld{cursor:pointer}
.bld .glow{opacity:0; transition:opacity .2s}
.bld:hover .glow, .bld.sel .glow{opacity:1}
.bld .lift{transition:transform .25s cubic-bezier(.3,1.6,.5,1)}
.bld:hover .lift{transform:translateY(-4px)}
.hero-bob{animation:bob 2.6s ease-in-out infinite; transform-box:fill-box; transform-origin:bottom center}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
.flag-wave{animation:wave 1.8s ease-in-out infinite; transform-box:fill-box; transform-origin:left center}
@keyframes wave{0%,100%{transform:skewY(0) scaleX(1)}50%{transform:skewY(-8deg) scaleX(.9)}}
.selring{stroke-dasharray:10 7; animation:march 1.2s linear infinite}
@keyframes march{to{stroke-dashoffset:-34}}
.cloud{animation:drift 70s linear infinite}
.cloud.c2{animation-duration:95s; animation-delay:-40s}
@keyframes drift{from{transform:translateX(-260px)}to{transform:translateX(1260px)}}
.coin{animation:shine 3s ease-in-out infinite}
@keyframes shine{0%,100%{filter:brightness(1)}50%{filter:brightness(1.35)}}
.sparkle{animation:twinkle 2.2s ease-in-out infinite; transform-box:fill-box; transform-origin:center}
@keyframes twinkle{0%,100%{opacity:0; transform:scale(.4)}50%{opacity:1; transform:scale(1)}}

.gate-row{display:flex; flex-wrap:wrap; align-items:center; gap:8px; margin-top:10px; padding:0 4px}
.gate-row .lbl{font-family:var(--display); font-size:15px; margin-right:4px}
.chip{display:inline-flex; align-items:center; gap:6px; padding:3px 10px 3px 4px; border-radius:999px; background:rgba(0,0,0,.28); border:2px solid rgba(0,0,0,.35); font-size:12.5px; font-weight:800}
.chip .av{width:20px; height:20px; border-radius:50%; display:grid; place-items:center; font-size:10px; font-family:var(--display); color:#fff; border:1.5px solid rgba(255,255,255,.6)}
.chip .n{font-family:var(--mono); color:var(--text-dim); font-weight:500}

/* ---------- dossier ---------- */
.dossier{background:var(--parch); color:var(--ink); border:3px solid var(--wood-edge); border-radius:18px; box-shadow:var(--shadow);
  overflow:hidden; position:sticky; top:calc(env(safe-area-inset-top, 0px) + 12px)}
@media (max-width:1020px){ .dossier{position:static} }
.dz-head{display:grid; grid-template-columns:76px 1fr; gap:12px; padding:14px 14px 12px; background:linear-gradient(var(--parch-2), var(--parch)); border-bottom:2px dashed rgba(58,38,22,.3)}
.dz-head .port{width:76px; height:76px; border-radius:14px; border:3px solid var(--wood-edge); display:grid; place-items:center; overflow:hidden}
.dz-head h3{font-family:var(--display); font-weight:400; font-size:24px; margin:0; line-height:1.05; color:var(--ink)}
.dz-head .spec{font-size:12.5px; color:var(--ink-2); margin-top:2px}
.lvl{display:flex; align-items:center; gap:8px; margin-top:7px}
.lvl .shield{font-family:var(--display); font-size:13px; color:#fff; background:var(--wood-3); border:2px solid var(--wood-edge); border-radius:7px 7px 12px 12px; padding:1px 7px}
.lvl .xp{flex:1; height:10px; border-radius:6px; background:rgba(58,38,22,.18); overflow:hidden; border:1.5px solid rgba(58,38,22,.35)}
.lvl .xp i{display:block; height:100%; background:linear-gradient(90deg, #8fd16b, var(--ok))}
.dz-stats{display:grid; grid-template-columns:repeat(5,1fr); gap:0; border-bottom:2px dashed rgba(58,38,22,.3)}
.dz-stats div{padding:8px 4px; text-align:center}
.dz-stats b{display:block; font-family:var(--display); font-weight:400; font-size:22px; line-height:1; font-variant-numeric:tabular-nums}
.dz-stats span{font-size:10.5px; text-transform:uppercase; letter-spacing:.06em; color:var(--ink-2); font-weight:800}
.dz-body{padding:6px 14px 14px; display:grid; gap:12px; max-height:620px; overflow:auto}
@media (max-width:1020px){ .dz-body{max-height:none} }
.dz-sec h4{font-family:var(--display); font-weight:400; font-size:16px; margin:8px 0 6px; display:flex; align-items:center; gap:8px; color:var(--ink)}
.dz-sec h4 .count{font-family:var(--mono); font-size:12px; background:var(--ink); color:var(--parch); border-radius:999px; padding:0 7px}
.dz-sec .empty{font-size:13px; color:var(--ink-2); font-style:italic}
.pr{display:grid; grid-template-columns:auto 1fr; gap:3px 9px; padding:7px 0; border-top:1px solid rgba(58,38,22,.14)}
.pr:first-of-type{border-top:0}
.pr .pin{width:10px; height:10px; margin-top:5px; border-radius:3px; transform:rotate(45deg); border:1.5px solid rgba(0,0,0,.35)}
.pr a{font-weight:800; font-size:13.5px; text-decoration:none; color:var(--ink)}
.pr a:hover{text-decoration:underline}
.pr .meta{grid-column:2; display:flex; flex-wrap:wrap; gap:4px 8px; font-size:12px; color:var(--ink-2); align-items:center}
.pr .quote{grid-column:2; font-size:12.5px; color:var(--ink); background:rgba(58,38,22,.08); border-left:3px solid var(--wood-3); padding:5px 8px; border-radius:0 8px 8px 0; margin-top:2px}
.pr .quote b{font-weight:800}
.tag{display:inline-block; font-size:10.5px; font-weight:800; letter-spacing:.03em; padding:1px 7px; border-radius:999px; text-transform:uppercase; white-space:nowrap}
.t-open{background:#ecd6f8; color:#5d1f86}
.t-merged{background:#fbe6a6; color:#6e4b00}
.t-salvaged{background:#c7efe9; color:#0f5a52}
.t-superseded{background:#dfe3ea; color:#374151}
.t-duplicate{background:#f6d6cf; color:#8a2c19}
.t-closed, .t-withdrawn{background:#e4e1dc; color:#4b4540}
.t-notplanned{background:#e6dcf2; color:#4a2f6b}
.t-risk{background:#fde2d9; color:#8a2c19}
.t-decide{background:#fff0bf; color:#6e4b00}
.mono{font-family:var(--mono); font-size:11.5px}

/* ---------- lower ---------- */
.lower{display:grid; grid-template-columns:minmax(0,1.05fr) minmax(0,1fr); gap:16px; align-items:start}
@media (max-width:1020px){ .lower{grid-template-columns:minmax(0,1fr)} }
.filters{display:flex; flex-wrap:wrap; gap:6px; margin:0 4px 10px}
.btn{font:inherit; font-size:12.5px; font-weight:800; color:var(--text); background:linear-gradient(var(--wood-3), var(--wood-2)); border:2px solid var(--wood-edge); border-radius:10px; padding:4px 11px; cursor:pointer; box-shadow:0 2px 0 var(--wood-edge)}
.btn[aria-pressed="true"]{background:linear-gradient(#ffd564, var(--gold-2)); color:var(--ink)}
.btn:active{transform:translateY(2px); box-shadow:none}
.log{display:grid; gap:8px; max-height:560px; overflow:auto; padding-right:2px}
.ev{display:grid; grid-template-columns:34px 1fr; gap:10px; background:var(--parch); color:var(--ink); border-radius:12px; padding:9px 11px; border:2px solid var(--wood-edge)}
.ev .ico{width:34px; height:34px; border-radius:10px; display:grid; place-items:center; border:2px solid rgba(0,0,0,.3)}
.ev .top{display:flex; flex-wrap:wrap; gap:4px 8px; align-items:baseline; font-size:12.5px; color:var(--ink-2)}
.ev .who{font-weight:800; color:var(--ink); font-size:13.5px}
.ev .txt{font-size:13.5px; margin-top:2px}
.ev .on{font-size:12px; margin-top:4px; color:var(--ink-2)}
.ev .on a{font-weight:800; color:var(--ink)}
.bot{font-size:10px; font-weight:800; letter-spacing:.05em; text-transform:uppercase; background:var(--ink); color:var(--parch); border-radius:5px; padding:0 5px}

.report{display:grid; gap:10px}
.intel{display:grid; grid-template-columns:40px 1fr; gap:10px; background:rgba(0,0,0,.22); border:2px solid rgba(0,0,0,.35); border-radius:12px; padding:10px 12px}
.intel .badge{width:40px; height:40px; border-radius:11px; display:grid; place-items:center; font-family:var(--display); font-size:15px; border:2px solid rgba(0,0,0,.4)}
.intel h5{margin:0; font-size:14.5px; font-weight:800}
.intel p{margin:3px 0 0; font-size:13.5px; color:var(--text-dim); max-width:65ch}
.intel p b{color:var(--text)}
.good .badge{background:#3f7d36; color:#eaffdf}
.warn .badge{background:#9a6a12; color:#fff3cf}
.bad .badge{background:#8f3222; color:#ffe4dc}
.chart{background:rgba(0,0,0,.22); border:2px solid rgba(0,0,0,.35); border-radius:12px; padding:10px 12px}
.chart h5{margin:0 0 6px; font-size:14.5px; font-weight:800}
.chart .legend{display:flex; flex-wrap:wrap; gap:4px 12px; font-size:12px; color:var(--text-dim); margin-top:6px}
.chart .legend span{display:inline-flex; align-items:center; gap:5px}
.chart svg{width:100%; height:auto; display:block}

/* ---------- ledger ---------- */
.ledger-tools{display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin:0 4px 10px}
.ledger-tools input{font:inherit; font-size:13.5px; color:var(--ink); background:var(--parch); border:2px solid var(--wood-edge); border-radius:10px; padding:6px 10px; min-width:0; flex:1 1 220px}
.table-scroll{overflow:auto; max-height:620px; border-radius:12px; border:2px solid var(--wood-edge)}
table{width:100%; border-collapse:collapse; background:var(--parch); color:var(--ink); font-size:13px; min-width:720px}
th{font-family:var(--display); font-weight:400; font-size:14px; text-align:left; background:var(--parch-2); padding:8px 10px; position:sticky; top:0}
td{padding:7px 10px; border-top:1px solid rgba(58,38,22,.14); vertical-align:top}
td.num{font-family:var(--mono); font-variant-numeric:tabular-nums; white-space:nowrap}
td a{color:var(--ink); font-weight:700; text-decoration:none}
td a:hover{text-decoration:underline}
.agentchip{display:inline-flex; align-items:center; gap:5px; font-weight:800; font-size:12px; white-space:nowrap}
.foot{font-size:12.5px; color:var(--text-dim); text-align:center; max-width:80ch; margin:0 auto}
.foot code{font-family:var(--mono); font-size:12px}
.banner{background:rgba(0,0,0,.35); border:2px dashed var(--gold); color:var(--text); border-radius:12px; padding:9px 12px; font-size:13.5px}
@media (prefers-reduced-motion: reduce){
  *, *::before, *::after{animation:none !important; transition:none !important}
}
@media (max-width:560px){
  .brand h1{font-size:25px}
  .res{min-width:130px}
  .dz-stats b{font-size:19px}
}
</style>

<div class="wrap">
  <header class="topbar">
    <div class="brand">
      <svg width="44" height="44" viewBox="0 0 44 44" aria-hidden="true">
        <path d="M22 3 L39 10 V23 C39 33 31 39 22 42 C13 39 5 33 5 23 V10 Z" fill="#f3bb2d" stroke="#2c1b10" stroke-width="3"/>
        <path d="M14 14 V30 M30 14 V30 M14 22 H30" stroke="#2c1b10" stroke-width="4" stroke-linecap="round"/>
        <path d="M30 8 l3 -4 l3 4" fill="none" stroke="#fff6e2" stroke-width="2" stroke-linecap="round"/>
      </svg>
      <div>
        <h1>Hermes Base</h1>
        <div class="sub" id="subline">Autoresolver campaign on <b>NousResearch/hermes-agent</b> · scouting…</div>
      </div>
    </div>
    <div class="resources" id="resources"></div>
  </header>

  <div id="banner" class="banner" hidden></div>

  <section class="board">
    <div class="panel">
      <h2>The base <small>Hover or tap an agent to open its dossier</small></h2>
      <div class="scene-wrap" id="sceneWrap">
        <svg id="scene" viewBox="0 0 1000 570" role="img" aria-label="Isometric base: six autoresolver agents around the main-branch town hall"></svg>
        <div class="tip" id="tip" hidden></div>
        <div class="scene-hint" id="hint">Troops marching to the town hall are PRs in active review</div>
      </div>
      <div class="gate-row" id="gate"></div>
    </div>

    <aside class="dossier" id="dossier" aria-live="polite"></aside>
  </section>

  <section class="lower">
    <div class="panel">
      <h2>Battle log <small id="logNote"></small></h2>
      <div class="filters" id="logFilters"></div>
      <div class="log" id="log"></div>
    </div>
    <div class="panel">
      <h2>War report <small>what is working, what is not</small></h2>
      <div class="report" id="report"></div>
    </div>
  </section>

  <section class="panel">
    <h2>PR ledger <small id="ledgerNote"></small></h2>
    <div class="ledger-tools">
      <div class="filters" id="ledgerFilters" style="margin:0"></div>
      <input id="ledgerSearch" type="search" placeholder="Search titles, issues, labels" aria-label="Search PRs">
    </div>
    <div class="table-scroll"><table id="ledger"></table></div>
  </section>

  <p class="foot" id="foot"></p>
</div>

<script>
(() => {
"use strict";
const REPO = "NousResearch/hermes-agent";
const GH = "https://github.com/" + REPO;
const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;

/* ---------- agents ---------- */
const AGENTS = [
  { id:"core",    name:"Core Sage",      spec:"Agent loop, providers, compression, streaming", color:"#8e5bd8", dark:"#5b3596", item:"staff",
    scopes:["agent","streaming","compression","vision","anthropic","codex","copilot","copilot-acp","acp","local-models","memory","providers","delegate","openrouter","gemini"], comps:["agent","acp"] },
  { id:"gateway", name:"Gateway Herald", spec:"Messaging gateway and platform adapters", color:"#3b82c4", dark:"#23568a", item:"horn",
    scopes:["gateway","telegram","discord","slack","whatsapp","wecom","feishu","webhook","signal","matrix"], comps:["gateway","plugins"] },
  { id:"desktop", name:"Desktop Artisan", spec:"Desktop app, TUI, dashboard, builds", color:"#e07a4f", dark:"#a24a26", item:"brush",
    scopes:["desktop","tui","dashboard","build","pm","electron"], comps:["desktop","tui","dashboard"] },
  { id:"cli",     name:"CLI Smith",      spec:"CLI, config, install and update", color:"#c98a2b", dark:"#8a5a12", item:"hammer",
    scopes:["cli","config","install","update","backup","doctor","bootstrap","time","portal","docs","ci","windows","setup"], comps:["cli"] },
  { id:"tools",   name:"Tool Tinkerer",  spec:"Tools, terminal, files, skills, MCP", color:"#2e9e7e", dark:"#1a6a53", item:"wrench",
    scopes:["tools","terminal","file-safety","approval","plugin-guard","tts","web","toolsets","skills","mcp","computer-use","browser","file"], comps:["tools"] },
  { id:"cron",    name:"Cron Keeper",    spec:"Scheduler, kanban, background work", color:"#c2455b", dark:"#86263a", item:"hourglass",
    scopes:["cron","kanban","scheduler"], comps:["cron"] },
];
const AG = Object.fromEntries(AGENTS.map(a => [a.id, a]));
const scopeMap = {};
AGENTS.forEach(a => a.scopes.forEach(s => scopeMap[s] = a.id));

function agentOf(pr){
  const m = /^[a-z]+\(([^)]+)\)/i.exec(pr.title || "");
  if (m){
    const sc = m[1].toLowerCase().split(/[,/ ]/)[0];
    if (scopeMap[sc]) return scopeMap[sc];
  }
  for (const l of pr.labels || []){
    if (l.startsWith("comp/")){
      const c = l.slice(5);
      const a = AGENTS.find(x => x.comps.includes(c));
      if (a) return a.id;
    }
  }
  return "cli";
}

/* ---------- helpers ---------- */
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const $ = id => document.getElementById(id);
const MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
function fmtDate(s){ if(!s) return "—"; const d = new Date(s.length <= 10 ? s + "T12:00:00Z" : s); return MONTHS[d.getUTCMonth()] + " " + d.getUTCDate(); }
function fmtStamp(s){ if(!s) return "—"; const d = new Date(s); return fmtDate(s) + ", " + String(d.getUTCHours()).padStart(2,"0") + ":" + String(d.getUTCMinutes()).padStart(2,"0") + " UTC"; }
function daysBetween(a, b){ return Math.round((new Date(b) - new Date(a.length <= 10 ? a + "T12:00:00Z" : a)) / 864e5); }
function prUrl(pr){
  if (pr.n) return GH + "/pull/" + pr.n;
  return GH + "/pulls?q=" + encodeURIComponent('is:pr author:' + (SNAP.author || "PRATHAMESH75") + ' in:title "' + pr.title.replace(/"/g, "") + '"');
}
function outcome(pr){
  if (pr.state === "open") return "open";
  if (pr.state === "merged") return "merged";
  return pr.closeKind || "closed";
}
const OUT_LABEL = { open:"Open", merged:"Merged", salvaged:"Salvaged", superseded:"Superseded", duplicate:"Duplicate", withdrawn:"Withdrawn", notplanned:"Not planned", closed:"Closed" };
const OUT_COLOR = { open:"#b65ae3", merged:"#f3bb2d", salvaged:"#2bb3a3", superseded:"#8a8f98", duplicate:"#d9533b", withdrawn:"#8a8f98", notplanned:"#6b4f8a", closed:"#8a8f98" };
const tag = o => `<span class="tag t-${o}">${OUT_LABEL[o]}</span>`;
function initials(n){ const p = n.replace(/[^A-Za-z0-9]+/g, " ").trim().split(" "); return (p[0][0] + (p[1] ? p[1][0] : (p[0][1] || ""))).toUpperCase(); }
function hue(n){ let h = 0; for (const c of n) h = (h * 31 + c.charCodeAt(0)) % 360; return `hsl(${h} 45% 42%)`; }

/* ---------- state ---------- */
let SNAP = null;
let ARCHIVE = [], FEED = [], logLimit = 120;
let stats = {};
let selected = "core", pinned = false, logFilter = "all", ledgerFilter = "all", ledgerQuery = "";

function computeStats(){
  const today = SNAP.generatedAt || new Date().toISOString();
  stats = {};
  AGENTS.forEach(a => stats[a.id] = { open:[], merged:[], closed:[], review:[], all:[] });
  const REVIEW_KINDS = ["comment", "review", "approve", "changes"];
  const nonAuthorByPr = {};
  FEED.forEach(e => { if (e.who !== SNAP.author && REVIEW_KINDS.includes(e.kind) && (!nonAuthorByPr[e.pr] || e.at > nonAuthorByPr[e.pr].at)) nonAuthorByPr[e.pr] = e; });
  for (const pr of SNAP.prs){
    pr._agent = agentOf(pr);
    pr._out = outcome(pr);
    pr._age = daysBetween(pr.created, today);
    pr._last = pr.n ? (nonAuthorByPr[pr.n] || null) : null;
    const s = stats[pr._agent];
    s.all.push(pr);
    if (pr.state === "open"){
      s.open.push(pr);
      if ((pr.comments || 0) >= 3 || pr._last) s.review.push(pr);
    } else if (pr.state === "merged" || pr.closeKind === "salvaged") s.merged.push(pr);
    else s.closed.push(pr);
  }
  const byNew = (a, b) => (b.created || "").localeCompare(a.created || "");
  AGENTS.forEach(a => {
    const s = stats[a.id];
    s.open.sort(byNew); s.merged.sort(byNew); s.closed.sort(byNew);
    s.review.sort((x, y) => ((y._last && y._last.at) || y.created).localeCompare((x._last && x._last.at) || x.created));
    s.level = 1 + Math.floor(s.all.length / 5);
    s.xp = (s.all.length % 5) / 5;
  });
}

/* ---------- scene drawing ---------- */
const CX = 500, CY = 285;
const POS = AGENTS.map((a, i) => {
  const ang = (-120 + i * 60) * Math.PI / 180;
  return { x: CX + 300 * Math.cos(ang), y: CY + 140 * Math.sin(ang) };
});
function pt(x, y){ return x.toFixed(1) + "," + y.toFixed(1); }
function shade(hex, f){
  const n = parseInt(hex.slice(1), 16); let r = n >> 16, g = (n >> 8) & 255, b = n & 255;
  const t = f < 0 ? 0 : 255, p = Math.abs(f);
  r = Math.round((t - r) * p + r); g = Math.round((t - g) * p + g); b = Math.round((t - b) * p + b);
  return "#" + ((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1);
}
function isoBox(cx, cy, s, h, wall, roof, roofH){
  const hs = s / 2;
  const L = [cx - s, cy], B = [cx, cy + hs], R = [cx + s, cy], T = [cx, cy - hs];
  const up = p => [p[0], p[1] - h];
  const e = 1.16, rs = s * e, rhs = hs * e;
  const rL = [cx - rs, cy - h], rB = [cx, cy - h + rhs], rR = [cx + rs, cy - h], rT = [cx, cy - h - rhs];
  const apex = [cx, cy - h - roofH];
  const poly = (pts, fill, extra = "") => `<polygon points="${pts.map(p => pt(p[0], p[1])).join(" ")}" fill="${fill}" stroke="#2c1b10" stroke-width="2" stroke-linejoin="round" ${extra}/>`;
  return [
    poly([L, B, up(B), up(L)], shade(wall, -0.18)),
    poly([B, R, up(R), up(B)], wall),
    poly([rT, rL, apex], shade(roof, -0.28)),
    poly([rT, rR, apex], shade(roof, -0.1)),
    poly([rL, rB, apex], shade(roof, -0.12)),
    poly([rB, rR, apex], roof),
    `<polyline points="${pt(apex[0], apex[1])} ${pt(rB[0], rB[1])}" stroke="rgba(255,255,255,.35)" stroke-width="2" fill="none"/>`
  ].join("");
}
function itemIcon(kind, x, y, sc = 1, stroke = "#2c1b10"){
  const t = `transform="translate(${x},${y}) scale(${sc})"`;
  const sw = `stroke="${stroke}" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"`;
  switch (kind){
    case "staff": return `<g ${t}><line x1="0" y1="10" x2="0" y2="-9" ${sw}/><circle cx="0" cy="-11" r="4.5" fill="#d9b7ff" ${sw}/></g>`;
    case "horn": return `<g ${t}><path d="M-8 4 L6 -6 L8 6 Z" fill="#ffe29a" ${sw}/><line x1="-8" y1="4" x2="-10" y2="9" ${sw}/></g>`;
    case "brush": return `<g ${t}><line x1="-6" y1="9" x2="4" y2="-5" ${sw}/><path d="M3 -4 Q9 -12 10 -10 Q9 -3 5 -2 Z" fill="#ffb38f" ${sw}/></g>`;
    case "hammer": return `<g ${t}><line x1="-4" y1="10" x2="3" y2="-4" ${sw}/><rect x="-3" y="-11" width="13" height="7" rx="1.5" fill="#cfd6de" ${sw} transform="rotate(26 3 -7)"/></g>`;
    case "wrench": return `<g ${t}><line x1="-6" y1="9" x2="3" y2="-3" ${sw}/><circle cx="5" cy="-5" r="5" fill="#bfeee0" ${sw}/><circle cx="7" cy="-7" r="1.6" fill="${stroke}"/></g>`;
    case "hourglass": return `<g ${t}><path d="M-6 -10 H6 L0 0 L6 10 H-6 L0 0 Z" fill="#ffd0d8" ${sw}/></g>`;
  }
  return "";
}

  parts.push(`<rect width="1000" height="570" fill="#284b2d"/>`);

  const gateL = [470, 485], gateR = [530, 485];
  parts.push(wall(D.l, D.t), wall(D.t, D.r));

  parts.push(`<rect width="1000" height="570" fill="url(#vign)" pointer-events="none"/>`);

/* ---------- tooltip ---------- */
function showTip(id){
  if (!SNAP) return;
  const a = AG[id], s = stats[id], i = AGENTS.indexOf(a);
  const svg = $("scene"), wrap = $("sceneWrap"), tip = $("tip");

function mergeFeed(){
  const latest = SNAP ? (SNAP.feed || []) : [];
  const exactKeys = new Set(latest.filter(e => !e.day).map(e => [e.pr, e.who, e.kind, e.at.slice(0, 10)].join("|")));
  const seen = new Set(), out = [];
  for (const e of [...latest, ...ARCHIVE]){
    const k = [e.pr, e.who, e.kind, e.at.slice(0, 10)].join("|");
    if (e.day && exactKeys.has(k)) continue;
    const id = k + "|" + e.at + "|" + (e.text || "").slice(0, 40);
    if (seen.has(id)) continue;
    seen.add(id); out.push(e);
  }
  FEED = out;
}

/* ---------- war report ---------- */
function renderReport(){
  const t = SNAP.totals, prs = SNAP.prs, today = SNAP.generatedAt;
  const salv = prs.filter(p => p.closeKind === "salvaged");
  const sup = prs.filter(p => p.closeKind === "superseded");
  const dup = prs.filter(p => p.closeKind === "duplicate");
  const selfClosed = sup.filter(p => p.via === SNAP.author);
  const unknownClosed = t.closed - prs.filter(p => p.state === "closed" && p.closeKind).length;
  const landers = {}; salv.forEach(p => { if (p.via) landers[p.via] = (landers[p.via] || 0) + 1; });
  const topLanders = Object.entries(landers).sort((a, b) => b[1] - a[1]).slice(0, 3);
  const recentOf = arr => [...arr].sort((a, b) => (b.closed || "").localeCompare(a.closed || "")).slice(0, 2);
  const open = prs.filter(p => p.state === "open");
  const stale = open.filter(p => p._age > 30);
  const oldest = open.reduce((m, p) => (!m || p.created < m.created) ? p : m, null);
  const decide = open.filter(p => (p.labels || []).includes("needs-decision"));
  const risky = open.filter(p => (p.labels || []).some(l => l === "sweeper:risk-security-boundary"));
  const quiet = open.filter(p => (p.comments || 0) <= 1);
  const revs = reviewerList();
  const busiest = AGENTS.map(a => ({ a, n: stats[a.id].open.length })).sort((x, y) => y.n - x.n)[0];
  const landed = t.merged + salv.length, finished = t.merged + t.closed;
  const landRate = Math.round(landed / Math.max(1, finished) * 100);
  const intel = [
    { cls: landRate >= 40 ? "good" : "warn", badge: landRate + "%", h:"Most wins arrive as salvage",
      p:`<b>${landed}</b> of the <b>${finished}</b> finished PRs landed on main. Only <b>${t.merged}</b> merged as-is; <b>${salv.length}</b> were cherry-picked or carried over by a maintainer${topLanders.length ? ` (${topLanders.map(([w, n]) => `${esc(w)} ${n}`).join(", ")})` : ""}. Maintainers here prefer to land fixes in their own PRs, so salvage is the normal path to main.${unknownClosed ? ` ${unknownClosed} closed PRs have no recorded reason.` : ""}` },
    { cls:"bad", badge: sup.length + dup.length, h:"Beaten to the fix",
      p:`<b>${sup.length}</b> closed PRs were overtaken by a different fix on main, and the autoresolver itself noticed and closed <b>${selfClosed.length}</b> of them. Another <b>${dup.length}</b> duplicated a PR that already existed${recentOf([...sup, ...dup]).length ? `, most recently ${recentOf([...sup, ...dup]).map(p => `#${p.n}`).join(" and ")}` : ""}. Before branching, have it check open PRs and the last few days of main for the issue number.` },
    { cls: stale.length > 20 ? "bad" : "warn", badge: stale.length, h:"Open backlog is aging",
      p:`<b>${stale.length}</b> of ${open.length} open PRs in this snapshot are over 30 days old. The oldest, opened ${fmtDate(oldest && oldest.created)}, has waited <b>${oldest ? oldest._age : 0} days</b>. Closing or rebasing stale ones keeps reviewers focused on fresh work.` },
    { cls:"warn", badge: decide.length, h:"Waiting on a maintainer decision",
      p:`${decide.length} open PRs carry <b>needs-decision</b>${decide.length ? ": " + decide.slice(0, 3).map(p => esc(p.title.replace(/^\w+\([^)]*\):\s*/, ""))).join("; ") : ""}. More pushes won't move these; a short question on the issue might.` },
    (() => {
      const last = {};
      [...FEED].sort((a, b) => a.at.localeCompare(b.at)).forEach(e => last[e.pr] = e);
      const waiting = Object.values(last).filter(e => e.who !== SNAP.author && ["review","comment","changes"].includes(e.kind) && prs.find(p => p.n === e.pr && p.state === "open"));
      const threads = new Set(FEED.filter(e => e.who !== SNAP.author && ["comment","review","approve","changes"].includes(e.kind)).map(e => e.pr)).size;
      return { cls: waiting.length ? "bad" : "good", badge: waiting.length, h: waiting.length ? "Reviewers waiting on a reply" : "Every reviewer has a reply",
        p: `${revs.length} reviewers commented across ${threads} threads${revs.length ? `, led by <b>${esc(revs[0].who)}</b>` : ""}. ` +
          (waiting.length ? `A reviewer spoke last on ${waiting.map(e => `<b>#${e.pr}</b> (${esc(e.who)})`).join(", ")}; the autoresolver should answer or push.` : `On every open thread the autoresolver has the last word, with a pushed fix or a reasoned reply.`) };
    })(),
    (() => {
      const top = [...risky].sort((a, b) => (b.comments || 0) - (a.comments || 0))[0];
      return { cls:"warn", badge: risky.length, h:"Security-boundary changes in flight",
        p:`${risky.length} open PRs are tagged <b>risk: security boundary</b>.${top ? ` They draw the longest reviews: ${top.n ? "#" + top.n : esc(top.title)} has ${top.comments} thread entries.` : ""} Keep them small and link the exact reproduction.` };
    })(),
    { cls:"warn", badge: quiet.length, h:"Untouched PRs",
      p:`${quiet.length} open PRs have one or no thread entries. <b>${esc(busiest.a.name)}</b> holds the most open work (${busiest.n}); that is where reviewer attention is thinnest.` },
  ];
  $("report").innerHTML = weeklyChart() + intel.map(i => `<div class="intel ${i.cls}"><div class="badge">${i.badge}</div><div><h5>${i.h}</h5><p>${i.p}</p></div></div>`).join("");
}
function weeklyChart(){
  const prs = SNAP.prs; if (!prs.length) return "";
  const wk = d => { const x = new Date(d + "T12:00:00Z"); const day = (x.getUTCDay() + 6) % 7; x.setUTCDate(x.getUTCDate() - day); return x.toISOString().slice(0, 10); };
  const weeks = {};
  prs.forEach(p => { const k = wk(p.created.slice(0, 10)); (weeks[k] = weeks[k] || { open:0, landed:0, closed:0 }); const o = p._out; if (o === "open") weeks[k].open++; else if (o === "merged" || o === "salvaged") weeks[k].landed++; else weeks[k].closed++; });
  const keys = Object.keys(weeks).sort();
  const first = new Date(keys[0] + "T12:00:00Z"), last = new Date(keys[keys.length - 1] + "T12:00:00Z");
  const all = []; for (let d = new Date(first); d <= last; d.setUTCDate(d.getUTCDate() + 7)) all.push(d.toISOString().slice(0, 10));
  const max = Math.max(...all.map(k => weeks[k] ? weeks[k].open + weeks[k].landed + weeks[k].closed : 0));
  const top = Math.ceil(max / 5) * 5 || 5;
  const W = 520, H = 170, pl = 28, pr = 8, pt_ = 10, pb = 26;
  const bw = (W - pl - pr) / all.length;
  const y = v => pt_ + (H - pt_ - pb) * (1 - v / top);
  let g = "";
  for (let v = 0; v <= top; v += top / 5 >= 1 ? Math.round(top / 5) : 1){
    g += `<line x1="${pl}" x2="${W - pr}" y1="${y(v)}" y2="${y(v)}" stroke="rgba(255,246,226,.12)"/><text x="${pl - 6}" y="${y(v) + 4}" text-anchor="end" font-size="10" fill="#e7d6b4" font-family="IBM Plex Mono, monospace">${v}</text>`;
  }
  all.forEach((k, i) => {
    const w = weeks[k] || { open:0, landed:0, closed:0 };
    let acc = 0; const x = pl + i * bw + bw * .15, bwi = bw * .7;
    [["landed","#f3bb2d"],["closed","#8a8f98"],["open","#b65ae3"]].forEach(([f, c]) => {
      if (!w[f]) return;
      g += `<rect x="${x.toFixed(1)}" y="${y(acc + w[f]).toFixed(1)}" width="${bwi.toFixed(1)}" height="${(y(acc) - y(acc + w[f])).toFixed(1)}" fill="${c}" stroke="#2c1b10" stroke-width="1"><title>Week of ${fmtDate(k)}: ${w[f]} ${f}</title></rect>`;
      acc += w[f];
    });
    if (i % 2 === 0 || all.length < 9) g += `<text x="${(x + bwi / 2).toFixed(1)}" y="${H - 8}" text-anchor="middle" font-size="10" fill="#e7d6b4" font-family="IBM Plex Mono, monospace">${fmtDate(k)}</text>`;
  });
  return `<div class="chart"><h5>PRs launched per week</h5><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Stacked bars of PRs opened per week by outcome">${g}</svg>
    <div class="legend"><span><i class="dot" style="background:#f3bb2d"></i>Landed</span><span><i class="dot" style="background:#b65ae3"></i>Still open</span><span><i class="dot" style="background:#8a8f98"></i>Closed</span><span>${prs.length} of ${SNAP.totals.all} PRs in this snapshot</span></div></div>`;
}

const LEDGER_F = [["all","All"],["open","Open"],["landed","Landed"],["closed","Closed"]];
function renderLedgerFilters(){
  $("ledgerFilters").innerHTML = LEDGER_F.map(([k, l]) => `<button class="btn" data-f="${k}" aria-pressed="${ledgerFilter === k}">${l}</button>`).join("");
  $("ledgerFilters").querySelectorAll("button").forEach(b => b.onclick = () => { ledgerFilter = b.dataset.f; renderLedgerFilters(); renderLedger(); });
}
function renderLedger(){
  let rows = [...SNAP.prs].sort((a, b) => b.created.localeCompare(a.created));
  if (ledgerFilter === "open") rows = rows.filter(p => p._out === "open");
  if (ledgerFilter === "landed") rows = rows.filter(p => p._out === "merged" || p._out === "salvaged");
  if (ledgerFilter === "closed") rows = rows.filter(p => !["open","merged","salvaged"].includes(p._out));
  const q = ledgerQuery.trim().toLowerCase();
  if (q.startsWith("agent:")) rows = rows.filter(p => p._agent === q.slice(6));
  else if (q) rows = rows.filter(p => (p.title + " " + (p.issue || "") + " " + (p.n || "") + " " + (p.labels || []).join(" ")).toLowerCase().includes(q));
  $("ledgerNote").textContent = `${rows.length} shown · ${SNAP.prs.length} of ${SNAP.totals.all} in snapshot`;
  $("ledger").innerHTML = `<thead><tr><th>PR</th><th>Title</th><th>Agent</th><th>Opened</th><th>Thread</th><th>Status</th></tr></thead><tbody>` +
    rows.map(p => { const a = AG[p._agent]; return `<tr>
      <td class="num">${p.n ? "#" + p.n : "—"}</td>
      <td><a href="${prUrl(p)}" target="_blank" rel="noopener">${esc(p.title)}</a>${p.issue ? ` <span class="mono" style="color:var(--ink-2)">· issue #${p.issue}</span>` : ""}</td>
      <td><span class="agentchip"><i class="dot" style="background:${a.color}"></i>${esc(a.name)}</span></td>
      <td class="num">${fmtDate(p.created)}</td>
      <td class="num">${p.comments ?? 0}</td>
      <td>${tag(p._out)}</td></tr>`; }).join("") + `</tbody>`;
}
$("ledgerSearch").addEventListener("input", e => { ledgerQuery = e.target.value; renderLedger(); });

/* ---------- boot ---------- */
function renderAll(){
  computeStats();
  if (!pinned){
    const best = AGENTS.map(a => ({ id: a.id, n: stats[a.id].review.length * 3 + stats[a.id].open.length })).sort((x, y) => y.n - x.n)[0];
    selected = best.id;
  }
  renderHeader(); drawScene(); renderDossier(); renderGate(); renderLogFilters(); renderLog(); renderReport(); renderLedgerFilters(); renderLedger();
  $("foot").innerHTML = SNAP.complete ? `Snapshot ${fmtStamp(SNAP.generatedAt)} from ${esc(SNAP.source)}.`
    : `Snapshot ${fmtStamp(SNAP.generatedAt)} from ${esc(SNAP.source)}. Totals are exact; the lists hold ${SNAP.prs.length} of ${SNAP.totals.all} PRs and the review threads read so far. Run <code>refresh_snapshot.py</code> to load everything.`;
}
function showBanner(msg){ const b = $("banner"); b.textContent = msg; b.hidden = false; }

drawScene(); renderDossier();
const use = window.claude && window.claude.use ? window.claude.use("db") : Promise.resolve(null);
use.then(db => {
  if (!db){ showBanner("Live data isn't available in this view. Open the page on claude.ai while signed in to load the snapshot."); return; }
  db.doc("snapshot/latest").onSnapshot(snap => {
    if (!snap.exists){ showBanner("No snapshot stored yet. Run refresh_snapshot.py and upload its output to fill the base."); return; }
    $("banner").hidden = true;
    SNAP = snap.data();
    mergeFeed(); renderAll();
  }, err => showBanner("Couldn't load the snapshot: " + (err && err.message ? err.message : "unknown error") + ". Reload to try again."));
  db.collection("feed").onSnapshot(q => {
    ARCHIVE = q.docs.flatMap(d => (d.data() || {}).events || []);
    if (SNAP){ mergeFeed(); renderAll(); }
  }, () => {});
}).catch(() => showBanner("Live data isn't available in this view."));
})();
</script>
